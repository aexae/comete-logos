name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pas de `version:` ici — pnpm/action-setup@v4 refuse la double
      # déclaration et lit `packageManager` de package.json (source unique).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # La peer dep @aexae/comete-design-tokens est un package GitHub Packages
      # privé : l'install échoue sans jeton (cf. .npmrc → ${NPM_AUTH_TOKEN}).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Intégrité du paquet publié : valide exports, fichiers et types.
      - name: Package integrity (publint)
        run: pnpm dlx publint
