name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Pas de `version:` ici — pnpm/action-setup@v5 refuse la double
      # déclaration et lit `packageManager` de package.json (source unique).
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # La peer dep @aexae/comete-design-tokens est un package GitHub Packages
      # privé : l'install échoue sans jeton (cf. .npmrc → ${NPM_AUTH_TOKEN}).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # GITHUB_TOKEN (Actions, permissions: packages: read) : lit @aexae/comete-design-tokens
          # (privé) qui accorde l'Actions access à ce dépôt. Plus de PAT.
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Intégrité du paquet publié : valide exports, fichiers et types.
      - name: Package integrity (publint)
        run: pnpm dlx publint
